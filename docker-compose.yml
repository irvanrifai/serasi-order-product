
services:
  # --- CORE APPLICATION SERVICES ---
  postgres_db:
    image: postgres:15-alpine
    container_name: order-product-postgres-db
    env_file:
      - .env
    ports:
      - "${OUTER_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apps-network
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_broker:
    image: redis:7-alpine
    container_name: order-product-redis-broker
    ports:
      - "${OUTER_REDIS_PORT}:6379"
    networks:
      - apps-network
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_PORT=${APP_PORT:-3000}
    container_name: order-product-api
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/main.js"
    networks:
      - apps-network
      - monitoring

  # --- MONITORING STACK SERVICES ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: order-product-prometheus
    restart: unless-stopped
    ports:
      - "${OUTER_PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring-stack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring-stack/prometheus/rules.yml:/etc/prometheus/rules.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring
    labels:
      - "app_env=${APP_ENV}"
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.0
    container_name: order-product-grafana
    restart: unless-stopped
    ports:
      - "${OUTER_GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring-stack/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    labels:
      - "app_env=${APP_ENV}"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: order-product-alertmanager
    restart: unless-stopped
    ports:
      - "${OUTER_ALERTMANAGER_PORT}:9093"
    volumes:
      - ./monitoring-stack/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - monitoring
    labels:
      - "app_env=${APP_ENV}"
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: order-product-node-exporter
    restart: unless-stopped
    ports:
      - "${OUTER_NODE_EXPORTER_PORT}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring
    labels:
      - "app_env=${APP_ENV}"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: order-product-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${OUTER_CADVISOR_PORT}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring
    labels:
      - "app_env=${APP_ENV}"

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: order-product-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://${REDIS_HOST}:${REDIS_PORT}
    networks:
      - monitoring
    labels:
      - "app_env=${APP_ENV}"

networks:
  apps-network:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: